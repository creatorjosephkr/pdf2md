name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "PDF 얼개 (PDF Eolgae) ${TAG}" \
              --generate-notes
          fi

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            asset_suffix: macOS_arm64.dmg
          - rust_target: x86_64-apple-darwin
            asset_suffix: macOS_x64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          prefix-key: "rust-${{ matrix.rust_target }}"
      - name: Clean Python bytecode caches
        run: find engine/src -name "__pycache__" -type d -exec rm -rf {} + || true
      - name: Download bundled uv binary (${{ matrix.rust_target }})
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rm -rf /tmp/uv_dl && mkdir -p /tmp/uv_dl apps/desktop/src-tauri/vendor-bin
          curl -fsSL "https://github.com/astral-sh/uv/releases/latest/download/uv-${RUST_TARGET}.tar.gz" -o /tmp/uv_dl/uv.tar.gz
          tar -xzf /tmp/uv_dl/uv.tar.gz -C /tmp/uv_dl
          UV_FOUND=$(find /tmp/uv_dl -type f -name "uv" | head -n 1)
          test -n "$UV_FOUND"
          cp "$UV_FOUND" apps/desktop/src-tauri/vendor-bin/uv
          chmod 755 apps/desktop/src-tauri/vendor-bin/uv
          xattr -c apps/desktop/src-tauri/vendor-bin/uv || true
      - name: Install frontend dependencies & build macOS app (${{ matrix.rust_target }})
        run: |
          cd apps/desktop
          npm ci
          npx tauri build --target "${{ matrix.rust_target }}" --bundles app
      - name: Ad-hoc deep sign and package custom macOS DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          BUNDLE_DIR="apps/desktop/src-tauri/target/${RUST_TARGET}/release/bundle/macos"
          SRC_APP="${BUNDLE_DIR}/PDF Eolgae.app"
          APP_PATH="${BUNDLE_DIR}/PDF 얼개.app"
          test -d "$SRC_APP"
          rm -rf "$APP_PATH"
          mv "$SRC_APP" "$APP_PATH"
          codesign --force --deep --sign "${APPLE_SIGNING_IDENTITY:--}" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet dmgbuild
          OUT_NAME="PDF_Eolgae_${VERSION}_${ASSET_SUFFIX}"
          /tmp/dmgvenv/bin/dmgbuild -s scripts/dmg_settings.py \
            -D app="$APP_PATH" \
            -D app_name="PDF 얼개.app" \
            -D background="apps/desktop/src-tauri/dmg/dmg-background.png" \
            -D icon="apps/desktop/src-tauri/icons/icon.icns" \
            "PDF 얼개" "$OUT_NAME"
          gh release upload "$TAG" "$OUT_NAME" --clobber

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Clean Python bytecode caches
        shell: bash
        run: find engine/src -name "__pycache__" -type d -exec rm -rf {} + || true
      - name: Download bundled uv.exe (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:TEMP\uv_dl", "apps/desktop/src-tauri/vendor-bin" | Out-Null
          $zipPath = "$env:TEMP\uv_dl\uv.zip"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\uv_dl" -Force
          $uvExe = Get-ChildItem -Path "$env:TEMP\uv_dl" -Recurse -Filter "uv.exe" | Select-Object -First 1
          if (-not $uvExe) { throw "uv.exe not found in archive" }
          Copy-Item -Path $uvExe.FullName -Destination "apps/desktop/src-tauri/vendor-bin/uv.exe" -Force
      - name: Install frontend dependencies & build Windows x64 NSIS installer
        run: |
          cd apps/desktop
          npm ci
          npx tauri build --bundles nsis
      - name: Rename and upload Windows x64 EXE to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $exe = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS setup.exe not found" }
          $outName = "PDF_Eolgae_${env:VERSION}_Windows_x64.exe"
          Copy-Item -Path $exe.FullName -Destination $outName -Force
          gh release upload $env:TAG $outName --clobber
