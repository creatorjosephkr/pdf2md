[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdf-convert-engine"
version = "1.0.0"
description = "Local high-fidelity Academic PDF to Markdown (.md) conversion engine"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "lxml>=5.2",
    "Pillow>=10.4",
    "typer>=0.12",
    "rich>=13.7",
    "docling[rapidocr]>=2.20",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "reportlab>=4.2",
]

[project.scripts]
pdf-convert = "pdf_convert_engine.cli:main"
pdf-convert-server = "pdf_convert_engine.server.app:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_convert_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
